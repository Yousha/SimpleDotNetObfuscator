# AppVeyor CI for SimpleDotNetObfuscator
# https://www.appveyor.com/docs/

version: 1.0.{build}
image: Visual Studio 2022

configuration: Release
platform: Any CPU

skip_commits:
  files:
    - '**/*.md'
    - 'LICENSE'
    - '.gitignore'

cache:
  - '%LocalAppData%\NuGet\Cache'
  - '%LocalAppData%\NuGet\v3-cache'

before_build:
  - nuget restore SimpleDotNetObfuscator.sln -NonInteractive

build:
  project: SimpleDotNetObfuscator.sln
  verbosity: minimal
  parallel: true

# Run the exact test assembly produced by the Release build.
test_script:
  - ps: |
      $testAssembly = Join-Path $env:APPVEYOR_BUILD_FOLDER 'SimpleDotNetObfuscator.Tests\Artifacts\bin\Release\SimpleDotNetObfuscator.Tests.dll'
      if (-not (Test-Path $testAssembly)) {
        throw "Test assembly was not produced: $testAssembly"
      }

      $vstest = Get-Command vstest.console.exe -ErrorAction Stop
      & $vstest.Source $testAssembly /logger:Appveyor
      if ($LASTEXITCODE -ne 0) {
        exit $LASTEXITCODE
      }

artifacts:
  - path: '**\Artifacts\bin\$(configuration)\*.exe'
    name: Executable
  - path: '**\Artifacts\bin\$(configuration)\*.dll'
    name: Libraries
  - path: '**\Artifacts\bin\$(configuration)\*.pdb'
    name: Symbols
    type: zip
